loncra:
  basic-service:
    ai:
      app:
        store-max-file-size-mb: 10
        source-of-truth:
          type: LOCAL
          path: "./"
          data-dir: ".loncra-admin"
          execute-timeout-seconds: 120
          max-output-bytes: 100000
        workspace:
          sandbox-type: DIRECTORY
          path: "./.loncra-agent-workspace"
---
spring:
  config:
    activate:
      on-profile: resource-server-source-of-truth

loncra:
  basic-service:
    ai:
      app:
        store-max-file-size-mb: 10
        source-of-truth:
          type: RESOURCE_SERVER
          path: "loncra/agent/data/"
        workspace:
          sandbox-type: DIRECTORY
          path: "./.loncra-agent-workspace"

---
spring:
  config:
    activate:
      on-profile: docker-sandbox

loncra:
  basic-service:
    ai:
      app:
        workspace:
          sandbox-type: docker
        docker:
          image: "ubuntu:22.04"
          workspace-root: "/workspace"
