loncra:
  basic-service:
    ai:
      app:
        data-dir: ".loncra-admin"
        store-max-file-size-mb: 10
        source-of-truth:
          type: LOCAL
          path: "E:/"
        workspace:
          sandbox-type: DIRECTORY
          path: "E:/loncra-agent"

---
spring:
  config:
    activate:
      on-profile: docker-sandbox

loncra:
  basic-service:
    ai:
      app:
        workspace:
          sandbox-type: docker
        docker:
          image: "ubuntu:22.04"
          workspace-root: "/workspace"
